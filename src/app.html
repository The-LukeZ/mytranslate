<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="text-scale" content="scale" />
    <!-- Must come before the mode script, which recolours it to the saved light/dark mode. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- use-credentials: without it the manifest is fetched cookieless and Cloudflare Access blocks it. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="mytranslate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script nonce="%sveltekit.nonce%">
      %modewatcher.script%
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
